name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      target:
        type: choice
        options: [dev, production]
        default: dev
        required: true
      sha:
        description: Exact merged source SHA; production must use the dev-accepted source
        type: string
        required: true
permissions:
  contents: read
env:
  VITE_APP_ENV: local
  VITE_API_ORIGIN: http://localhost:8787
jobs:
  source:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate selected source before executing candidate code
        id: source
        env:
          SOURCE_SHA: ${{ inputs.sha || github.sha }}
          TARGET: ${{ inputs.target || 'dev' }}
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          case "$TARGET" in dev|production) ;; *) exit 1 ;; esac
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            test "$GITHUB_REF" = refs/heads/main
            git merge-base --is-ancestor "$SOURCE_SHA" origin/main
          fi
          printf 'sha=%s\n' "$SOURCE_SHA" >> "$GITHUB_OUTPUT"
  quality:
    needs: source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm audit --audit-level=high
  browser:
    needs: source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
  deploy:
    needs: [source, quality, browser]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.target || 'dev' }}
    concurrency:
      group: crypto-gateway-frontend-${{ inputs.target || 'dev' }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.source.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.workflow_sha }}
          path: control
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Deploy checked source to the selected isolated project
        env:
          DEPLOY_ENABLED: ${{ vars.DEPLOY_ENABLED }}
          DELIVERY_TARGET: ${{ inputs.target || 'dev' }}
          SOURCE_SHA: ${{ needs.source.outputs.sha }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          OTHER_VERCEL_PROJECT_ID: ${{ vars.OTHER_VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VITE_APP_ENV: ${{ inputs.target || 'dev' }}
          VITE_API_ORIGIN: ${{ vars.VITE_API_ORIGIN }}
          TARGET_ORIGIN: ${{ vars.TARGET_ORIGIN }}
        run: |
          node control/scripts/check-delivery.mjs
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$SOURCE_SHA"
          fi
          printf 'Source: `%s`\nTarget: %s\nRetain any prior compatible frontend/Worker identities; first production requires explicit no-predecessor acceptance under DELIVERY.md.\n' "$SOURCE_SHA" "$DELIVERY_TARGET" >> "$GITHUB_STEP_SUMMARY"
          url=$(npx --yes vercel@64.2.0 deploy --project "$VERCEL_PROJECT_ID" --prod --yes --token "$VERCEL_TOKEN" \
            --build-env "VITE_APP_ENV=$VITE_APP_ENV" --build-env "VITE_API_ORIGIN=$VITE_API_ORIGIN")
          printf 'Deployment: %s\n' "$url" >> "$GITHUB_STEP_SUMMARY"
          curl --fail --silent --show-error --max-time 30 "$TARGET_ORIGIN/" --output /dev/null
