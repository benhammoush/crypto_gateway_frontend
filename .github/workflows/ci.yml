# Generated by the pinned ci-cd-workflows template renderer.
# Project-owned annotations: preserve these when regenerating; the v1 renderer
# emits workflow structure without comments. See DELIVERY.md for operations.
# Shared foundation owns release safeguards; Gateway owns checkout/functions tests.
name: CI
on:
  # Shared: PRs verify only; native required checks/review gate a human merge.
  pull_request: null
  # Shared: the merged main commit must pass its own checks before automatic dev.
  push:
    branches:
      - main
  # Shared: manually revalidate/redeliver an exact merged SHA to dev only.
  # Production requires deploy-production.yml, never an arbitrary target input.
  workflow_dispatch:
    inputs:
      sha:
        description: Exact merged source SHA to revalidate and redeploy in dev
        type: string
        required: true
# Shared: read source and Actions evidence; no merge or repository-admin writes.
permissions:
  contents: read
  actions: read
jobs:
  # Shared: immutable web verification runs package.json's ci:* hooks and retains
  # their checked output. .github/ci-cd.json declares target-specific public inputs.
  # Project: ci:quality covers lint/format, backend contract provenance, types,
  # unit/failure-path tests, build and audit. ci:browser exercises built checkout
  # flows in Chromium, Firefox and WebKit with fixture settlement, not live funds.
  # Project: ci:prepare packages SPA plus merchant-demo server functions;
  # ci:verify-artifact probes emitted imports/status with upstream calls forbidden.
  # Server-only merchant/RPC credentials are never VITE build inputs.
  verify:
    uses: benhammoush/ci-cd-workflows/.github/workflows/verify-web.yml@d7d0c297f0b4038e9815349fd16f79bb92d77ceb
    with:
      # Shared: reusable workflow and implementation checkout use one immutable pin.
      automation_sha: d7d0c297f0b4038e9815349fd16f79bb92d77ceb
      # Shared: manual SHA or exact PR/main event revision, never implicit latest main.
      source_sha: ${{ inputs.sha || github.sha }}
      environment: dev
      # Project: Gateway frontend's supported runtime.
      node_version: "24"
  # Shared: only successful main push/manual dev checks can enter delivery.
  # The called job binds dev, checks artifact integrity/freshness without an opt-in and
  # serializes the target, retaining immutable deployment and smoke evidence.
  # Project: scripts/ci-deploy.mjs checks backend compatibility/build-input drift,
  # then uploads the prebuilt SPA/functions and reads the public demo status hint.
  # Smoke never creates/submits a payment; backend-first acceptance is still manual.
  deploy_dev:
    needs: verify
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    uses: benhammoush/ci-cd-workflows/.github/workflows/deploy-web.yml@d7d0c297f0b4038e9815349fd16f79bb92d77ceb
    with:
      automation_sha: d7d0c297f0b4038e9815349fd16f79bb92d77ceb
      source_sha: ${{ inputs.sha || github.sha }}
      environment: dev
      node_version: "24"
    # Shared: named provider secrets only, unavailable to verification jobs.
    # Target configuration/credentials resolve in the called environment-bound job.
    secrets:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      SMOKE_BYPASS: ${{ secrets.SMOKE_BYPASS }}
  # Project: keep quality and browser required by existing branch protection.
  # Shared: always-running bridges mirror verify, including failure, without
  # repeating tests or turning a failed prerequisite into a skipped required check.
  legacy_0:
    name: quality
    needs: verify
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - run: test "$VERIFY_RESULT" = success
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
  legacy_1:
    name: browser
    needs: verify
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - run: test "$VERIFY_RESULT" = success
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
