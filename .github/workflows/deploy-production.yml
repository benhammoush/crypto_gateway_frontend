# Generated by the pinned ci-cd-workflows template renderer.
# Project-owned annotations: preserve these when regenerating; the v1 renderer
# emits structure without comments. DELIVERY.md owns paired/payment/recovery acceptance.
name: Deploy production
on:
  # Shared: manual production dispatch from main, never automatic on merge/PR.
  # Project: release an explicitly compatible backend/frontend pair, backend first.
  workflow_dispatch:
    inputs:
      # Shared: full merged FRONTEND SHA with successful retained dev-delivery evidence.
      # The paired backend uses its own SHA; no implicit latest-main substitution.
      sha:
        description: Exact merged source SHA already delivered and accepted in dev
        type: string
        required: true
# Shared: read source ancestry and retained Actions evidence; no extra write PAT.
permissions:
  contents: read
  actions: read
jobs:
  # Shared: require exact dev evidence before production-configured candidate checks.
  # Project: ci:quality validates backend contract provenance, lint/types/unit tests,
  # audit and the build using declared production VITE_APP_ENV/VITE_API_ORIGIN.
  # ci:browser exercises built flows in three engines with payment fixtures only.
  # ci:prepare/ci:verify-artifact package SPA+server functions and probe imports/status
  # offline; runtime merchant/RPC credentials are never embedded in browser inputs.
  # Shared: retain the verified production output; differing target inputs do not
  # mean dev and production frontend bundles are byte-identical. No deploy secrets here.
  verify_release:
    uses: benhammoush/ci-cd-workflows/.github/workflows/verify-web.yml@a35aea526ca8b69d7ec27ff7952cff6af8c1bbe5
    with:
      # Shared: use the same immutable implementation and reusable workflow revision.
      automation_sha: a35aea526ca8b69d7ec27ff7952cff6af8c1bbe5
      source_sha: ${{ inputs.sha }}
      # Project public build values come from .github/ci-cd.json, not secret credentials.
      environment: production
      node_version: "24"
  # Shared: verification precedes the called job's native production approval gate;
  # reviewer/main-only/no-admin-bypass policy is configured in GitHub settings.
  # After approval, recheck dev evidence/artifact identity, retain isolation and
  # serialize mutations. Disabled or unconfigured targets do not become ready here.
  # Project: ci-deploy.mjs checks backend compatibility/build-input drift and uploads
  # the tested SPA/functions to Vercel without rebuilding. Post-deployment verification reads release identity
  # and the public demo status hint; it does not create/submit payments or certify
  # live settlement, human acceptance or real-funds use (production is Devnet-only).
  # Failed/uncertain mutations need investigation and fresh dispatch/approval;
  # no production job rerun, blind retry or automatic rollback is authorized.
  deploy_production:
    needs: verify_release
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    uses: benhammoush/ci-cd-workflows/.github/workflows/deploy-web.yml@a35aea526ca8b69d7ec27ff7952cff6af8c1bbe5
    with:
      automation_sha: a35aea526ca8b69d7ec27ff7952cff6af8c1bbe5
      source_sha: ${{ inputs.sha }}
      environment: production
      node_version: "24"
    # Shared: selected production deploy token/optional verification access credential only.
    # Neither reaches verification; runtime server credentials stay provider-managed.
    secrets:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      SMOKE_BYPASS: ${{ secrets.SMOKE_BYPASS }}
