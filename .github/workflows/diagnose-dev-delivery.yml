name: Diagnose dev delivery (read-only)
on:
  workflow_dispatch:
    inputs:
      deployment_id:
        description: Exact Vercel deployment ID from retained dev delivery evidence
        required: true
        type: string
      sha:
        description: Full source SHA recorded for that dev deployment
        required: true
        type: string
permissions:
  contents: read
jobs:
  diagnose:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    environment:
      name: dev
      deployment: false
    concurrency:
      group: deploy-${{ github.repository_owner }}-${{ github.event.repository.name }}-dev
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
      - name: Read deployment metadata and unauthenticated HTTP statuses only
        run: node scripts/diagnose-dev-delivery.mjs
        env:
          DEPLOYMENT_ID: ${{ inputs.deployment_id }}
          EXPECTED_SOURCE_SHA: ${{ inputs.sha }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          TARGET_ORIGIN: ${{ vars.TARGET_ORIGIN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
